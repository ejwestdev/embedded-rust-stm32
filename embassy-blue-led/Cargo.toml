[package]
name = "embassy-blue-led"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["stm32u575zi", "memory-x", "time-driver-tim2"] }
embassy-executor = { version = "0.9.0", features = ["arch-cortex-m", "executor-thread"] }
cortex-m = { version = "0.7.8", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
panic-halt = "1.0.0"
embassy-time = "0.5.1"
